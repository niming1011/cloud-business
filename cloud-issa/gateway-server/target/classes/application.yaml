spring:
  application:
    name: gateway-server
  config:

    # 这里根据下面的 prefix 和 profile 规则，去拉取 gateway-server-power-mall.yaml
    import:
    - nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  cloud:
    nacos:
      server-addr: 192.168.62.130:8848
      # 如果你的 Nacos 开启了鉴权，请取消下面两行的注释
      # username: nacos
      # password: nacos
      discovery:
        namespace: 910f1eca-65e0-4d40-b0d4-5c40c9ce57d0
        service: ${spring.application.name}
        group: GATEWAY_GROUP
      config:
        namespace: ${spring.cloud.nacos.discovery.namespace}
        # 【已修复】前缀应该是服务名，而不是服务器 IP
        prefix: ${spring.application.name}
        group: ${spring.cloud.nacos.discovery.group}
        file-extension: yaml
  profiles:
    # 建议写成单行格式
    active: dev